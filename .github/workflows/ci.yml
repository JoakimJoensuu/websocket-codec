name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        id: clang
        with:
          path: ${{ runner.temp }}/clang
          key: clang-23.1.0-${{ runner.os }}-tidy-format-v3
      - if: steps.clang.outputs.cache-hit != 'true'
        id: install
        run: |
          . /etc/os-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/apt.llvm.org.gpg
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-23.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-23 clang-tidy-23
          dest="${{ runner.temp }}/clang"
          mkdir -p "$dest/bin" "$dest/lib"
          cp -L "$(command -v clang-tidy-23)" "$dest/bin/clang-tidy"
          cp -L "$(command -v clang-format-23)" "$dest/bin/clang-format"
          ldd "$dest/bin/clang-tidy" "$dest/bin/clang-format" \
            | awk '/=> \//{print $3}' | sort -u \
            | while read -r lib; do
                cp -L "$lib" "$dest/lib/"
              done
          cp -a /usr/lib/llvm-23/lib/clang "$dest/lib/"
      - if: steps.install.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/clang
          key: clang-23.1.0-${{ runner.os }}-tidy-format-v3
      - run: cmake -B build
      - run: |
          export PATH="${{ runner.temp }}/clang/bin:$PATH"
          export LD_LIBRARY_PATH="${{ runner.temp }}/clang/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          clang-format --version
          clang-tidy --version
          sources=$(find include src examples tests -type f -name '*.[ch]' 2>/dev/null | sort)
          units=$(jq -r '.[].file' compile_commands.json)
          set +e
          if [ -n "$sources" ]; then
            clang-format --dry-run --Werror $sources | tee "$RUNNER_TEMP/format.log"
            fmt=${PIPESTATUS[0]}
          else
            fmt=0
            : > "$RUNNER_TEMP/format.log"
          fi
          if [ -n "$units" ]; then
            clang-tidy --experimental-custom-checks $units | tee "$RUNNER_TEMP/tidy.log"
            tidy=${PIPESTATUS[0]}
          else
            tidy=0
            : > "$RUNNER_TEMP/tidy.log"
          fi
          set -e
          {
            echo '## clang-format'
            if [ "$fmt" -eq 0 ]; then echo ok; else echo '```'; cat "$RUNNER_TEMP/format.log"; echo '```'; fi
            echo
            echo '## clang-tidy'
            if [ ! -s "$RUNNER_TEMP/tidy.log" ]; then echo ok; else echo '```'; cat "$RUNNER_TEMP/tidy.log"; echo '```'; fi
          } >>"$GITHUB_STEP_SUMMARY"
          test "$fmt" -eq 0 && test "$tidy" -eq 0

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
