name: ci

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"
      - name: clang-format and clang-tidy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-style.sh --ci

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DWSIO_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          python3 tests/smoke_echo.py

  autobahn:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - name: Build echo server
        run: cmake -B build && cmake --build build --target echo_server
      - name: Autobahn fuzzingclient
        run: ./scripts/run-autobahn.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: autobahn-report
          path: autobahn/reports
          if-no-files-found: ignore
