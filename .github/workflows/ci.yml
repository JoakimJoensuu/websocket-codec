name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLANG: ${{ runner.temp }}/clang
      CLANG_CACHE_KEY: clang-23.1.0-${{ runner.os }}-tidy-format
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        id: clang
        with:
          path: ${{ env.CLANG }}
          key: ${{ env.CLANG_CACHE_KEY }}
      - if: steps.clang.outputs.cache-hit != 'true'
        id: install
        run: |
          . /etc/os-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/apt.llvm.org.gpg
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-23.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-23 clang-tidy-23
          mkdir -p "$CLANG/bin" "$CLANG/lib"
          cp -L "$(command -v clang-tidy-23)" "$CLANG/bin/clang-tidy.real"
          cp -L "$(command -v clang-format-23)" "$CLANG/bin/clang-format.real"
          ldd "$CLANG/bin/clang-tidy.real" "$CLANG/bin/clang-format.real" \
            | awk '/=> \//{print $3}' | sort -u \
            | while read -r lib; do
                cp -L "$lib" "$CLANG/lib/"
              done
          for tool in clang-tidy clang-format; do
            printf '%s\n' '#!/bin/sh' \
              'd=$(CDPATH= cd -- "$(dirname "$0")" && pwd)' \
              'export LD_LIBRARY_PATH="$d/../lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
              "exec \"\$d/${tool}.real\" \"\$@\"" >"$CLANG/bin/$tool"
            chmod +x "$CLANG/bin/$tool"
          done
      - if: always() && steps.install.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CLANG }}
          key: ${{ env.CLANG_CACHE_KEY }}
      - run: cmake -B build
      - run: |
          export PATH="$CLANG/bin:$PATH"
          files=$(find include src examples -type f \( -name '*.c' -o -name '*.h' \) | sort)
          set +e
          clang-format --dry-run --Werror $files >"$RUNNER_TEMP/format.log" 2>&1
          fmt=$?
          clang-tidy -p build -j"$(nproc)" $files >"$RUNNER_TEMP/tidy.log" 2>&1
          tidy=$?
          set -e
          {
            echo '## clang-format'
            if [ "$fmt" -eq 0 ]; then echo ok; else echo '```'; cat "$RUNNER_TEMP/format.log"; echo '```'; fi
            echo
            echo '## clang-tidy'
            if [ ! -s "$RUNNER_TEMP/tidy.log" ]; then echo ok; else echo '```'; cat "$RUNNER_TEMP/tidy.log"; echo '```'; fi
          } >>"$GITHUB_STEP_SUMMARY"
          test "$fmt" -eq 0 && test "$tidy" -eq 0

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
