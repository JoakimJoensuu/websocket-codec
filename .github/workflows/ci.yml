name: ci

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build
      - uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: "18"
          style: file
          tidy-checks: ""
          extensions: c,h
          database: build
          files-changed-only: false
      - name: Fail if style checks failed
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DWSIO_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          python3 tests/smoke_echo.py

  autobahn:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - name: Build echo server
        run: cmake -B build && cmake --build build --target echo_server
      - name: Autobahn fuzzingclient
        run: ./scripts/run-autobahn.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: autobahn-report
          path: autobahn/reports
          if-no-files-found: ignore
