name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        id: clang
        with:
          path: ${{ runner.temp }}/clang
          key: clang-23.1.0-${{ runner.os }}-tidy-format
      - run: |
          if [ "${{ steps.clang.outputs.cache-hit }}" != "true" ]; then
            . /etc/os-release
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
              | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/apt.llvm.org.gpg
            echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-23 main" \
              | sudo tee /etc/apt/sources.list.d/llvm-23.list
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang-format-23 clang-tidy-23
            dest="${{ runner.temp }}/clang"
            mkdir -p "$dest/bin" "$dest/lib"
            cp -L "$(command -v clang-tidy-23)" "$dest/bin/clang-tidy.real"
            cp -L "$(command -v clang-format-23)" "$dest/bin/clang-format.real"
            ldd "$dest/bin/clang-tidy.real" "$dest/bin/clang-format.real" \
              | awk '/=> \//{print $3}' | sort -u \
              | while read -r lib; do
                  cp -L "$lib" "$dest/lib/"
                done
            for tool in clang-tidy clang-format; do
              printf '%s\n' '#!/bin/sh' \
                'd=$(CDPATH= cd -- "$(dirname "$0")" && pwd)' \
                'export LD_LIBRARY_PATH="$d/../lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
                "exec \"\$d/${tool}.real\" \"\$@\"" >"$dest/bin/$tool"
              chmod +x "$dest/bin/$tool"
            done
          fi
          cmake -B build
      - uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: ${{ runner.temp }}/clang/bin
          style: file
          tidy-checks: ""
          database: build
          file-annotations: false
          step-summary: true
      - if: steps.linter.outputs.checks-failed > 0
        run: exit 1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
