name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile commands
        run: cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Install clang-format-22 and clang-tidy-22
        run: |
          . /etc/os-release
          sudo wget -qO /etc/apt/trusted.gpg.d/apt.llvm.org.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          echo "deb https://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y clang-format-22 clang-tidy-22
      - name: clang-format
        run: clang-format-22 --dry-run -Werror $(git ls-files '*.c' '*.h')
      - name: clang-tidy
        run: clang-tidy-22 -p build --quiet --warnings-as-errors='*' $(git ls-files '*.c' '*.h')

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
