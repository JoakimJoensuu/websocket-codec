name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build
      - run: |
          wget https://apt.llvm.org/llvm.sh -O "${{ runner.temp }}/llvm.sh"
          chmod +x "${{ runner.temp }}/llvm.sh"
          sudo "${{ runner.temp }}/llvm.sh" 23
          sudo apt-get install -y clang-format-23 clang-tidy-23
          mkdir -p "${{ runner.temp }}/clang/bin"
          ln -s "$(command -v clang-tidy-23)" "${{ runner.temp }}/clang/bin/clang-tidy"
          ln -s "$(command -v clang-format-23)" "${{ runner.temp }}/clang/bin/clang-format"
      - uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: ${{ runner.temp }}/clang/bin
          style: file
          tidy-checks: ""
          database: build
          file-annotations: false
          step-summary: true
      - if: steps.linter.outputs.checks-failed > 0
        run: exit 1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
